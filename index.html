<!DOCTYPE html>
<html lang="sr">
<head>
  <link rel="icon" href="images/logo.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Delovi za poljoprivredne mašine | Prodaja Srbija | Plugeks</title>

  <meta name="description" content="Prodaja delova za poljoprivredne mašine u Srbiji: plugovi, drljače, freze, podrivači i setvospremači.">

  <link rel="stylesheet" href="styles.css">

  <style>

    .hero-large{
      min-height:520px;
      padding:70px 18px 80px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .hero-card-search{
      width:min(980px,100%);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:28px;
    }

    .hero-logo{
      max-width:260px;
    }

    .home-search{
      width:min(760px,92vw);
      position:relative;
      z-index:5;
    }

    .home-search-form{
      display:flex;
      align-items:center;
      gap:10px;
      background:#fff;
      border:1px solid rgba(0,0,0,.08);
      border-radius:999px;
      padding:10px 12px 10px 18px;
      box-shadow:0 18px 45px rgba(0,0,0,.18);
    }

    .home-search-icon{
      font-size:24px;
      color:#6b7280;
    }

    .home-search-form input{
      flex:1;
      border:0;
      outline:0;
      background:transparent;
      font-size:16px;
      color:#111;
    }

    .home-search-form button{
      border:0;
      border-radius:999px;
      padding:12px 22px;
      background:#1f3d2b;
      color:#fff;
      font-weight:700;
      cursor:pointer;
    }

    .home-search-results{
      display:none;
      position:absolute;
      left:0;
      right:0;
      top:calc(100% + 10px);
      background:#fff;
      border-radius:22px;
      box-shadow:0 22px 55px rgba(0,0,0,.22);
      overflow:hidden;
      max-height:390px;
      overflow-y:auto;
    }

    .home-search-results.open{
      display:block;
    }

    .search-item{
      display:block;
      padding:14px 18px;
      border-bottom:1px solid #eee;
      color:#111;
      text-decoration:none;
    }

    .search-item:hover{
      background:#f4f7f2;
    }

    .search-meta{
      font-size:13px;
      color:#777;
      margin-top:4px;
    }

  </style>
</head>

<body>

<nav class="nav-desktop">
  <div class="nav-wrap">
    <div class="nav-links">
      <a href="index.html">Početna</a>
      <a href="masine.html">Mašine</a>
      <a href="delovi-za-masine.html">Delovi za mašine</a>
      <a href="kontakt.html">Kontakt</a>
    </div>
  </div>
</nav>

<section class="hero hero-large">

  <div class="hero-card hero-card-search">

    <div class="hero-logo-slot">
      <img
        class="hero-logo"
        src="images/logo.png"
        alt="Plugeks logo"
      >
    </div>

    <div class="home-search" id="homeSearchBox">

      <form
        class="home-search-form"
        id="homeSearchForm"
        autocomplete="off"
      >

        <span class="home-search-icon">⌕</span>

        <input
          id="homeSearchInput"
          type="search"
          placeholder="Pretražite proizvode, delove, kategorije..."
        >

        <button type="submit">
          Pretraži
        </button>

      </form>

      <div
        class="home-search-results"
        id="homeSearchResults"
      ></div>

    </div>

  </div>

</section>

<section class="category-strip">
  <div class="category-buttons">

    <a class="big-link" href="masine.html">
      Poljoprivredne mašine
    </a>

    <a class="big-link" href="delovi-za-masine.html">
      Delovi za poljoprivredne mašine
    </a>

  </div>
</section>

<script src="data.js"></script>
<script src="data2.js"></script>
<script src="script.js"></script>

<script>

const PRODUCTS = (window.SITE_DATA && window.SITE_DATA.products)
  ? window.SITE_DATA.products
  : {};

function productHref(id){
  return 'proizvod.html?id=' + encodeURIComponent(id);
}

const searchInput = document.getElementById('homeSearchInput');
const searchResults = document.getElementById('homeSearchResults');
const searchForm = document.getElementById('homeSearchForm');

function renderResults(results){

  searchResults.innerHTML = '';

  if(!results.length){
    searchResults.classList.remove('open');
    return;
  }

  results.slice(0,8).forEach(product => {

    const a = document.createElement('a');

    a.className = 'search-item';

    a.href = productHref(product.id);

    a.innerHTML = `
      <strong>${product.name}</strong>

      <div class="search-meta">
        ${product.category || ''}
      </div>
    `;

    searchResults.appendChild(a);

  });

  searchResults.classList.add('open');
}

searchInput.addEventListener('input', function(){

  const value = this.value
    .toLowerCase()
    .trim();

  if(value.length < 2){
    searchResults.classList.remove('open');
    return;
  }

  const results = [];

  Object.values(PRODUCTS).forEach(product => {

    const text = `
      ${product.name || ''}
      ${product.category || ''}
      ${product.group || ''}
      ${product.section || ''}
    `.toLowerCase();

    if(text.includes(value)){
      results.push(product);
    }

  });

  renderResults(results);

});

searchForm.addEventListener('submit', function(e){

  e.preventDefault();

  const value = searchInput.value.trim();

  if(!value) return;

  searchResults.classList.remove('open');

  window.location.href =
    'pretraga.html?q=' + encodeURIComponent(value);

});

document.addEventListener('click', function(e){

  if(!e.target.closest('.home-search')){
    searchResults.classList.remove('open');
  }

});

</script>

</body>
</html>
